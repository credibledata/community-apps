# When an app's community-card.json reaches main (an app's pull request merged), open a pull request on the
# community site, credibledata/community, listing it on the Apps page. A person merges that one: merging deploys
# the site.
#
# Needs the repository secret COMMUNITY_SITE_TOKEN: a fine-grained token with Contents and Pull requests write on
# credibledata/community only. It runs on pushes to main, never on a pull request, so a fork never sees it.
name: Community card

on:
  push:
    branches: [main]
    paths: ["packages/*/community-card.json"]
  workflow_dispatch:
    inputs:
      package:
        description: "Apps to list, by folder name under packages/, separated by spaces"
        required: true

permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.cards.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cards this push added or changed
        id: cards
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ONE: ${{ inputs.package }}
        run: |
          # Names are split on spaces on purpose, with no filename expansion.
          set -f
          if [ -n "$ONE" ]; then
            names="$ONE"
          else
            case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE=$(git rev-list --max-parents=0 "$AFTER" | tail -1) ;; esac
            names=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'packages/*/community-card.json' | cut -d/ -f2 | sort -u)
          fi
          for n in $names; do
            echo "$n" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' || { echo "::error::$n is not a package name"; exit 1; }
          done
          # shellcheck disable=SC2086
          echo "names=$(printf '%s\n' $names | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"

  list:
    needs: cards
    if: needs.cards.outputs.names != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.cards.outputs.names) }}
    # One queue per app. A later run for the same app waits for the one listing it and replaces any run already
    # waiting, and each lists the card as it is on main when it starts, so the newest card is the one listed.
    # Different apps never wait on each other: each writes only its own branch on the site.
    concurrency:
      group: community-card-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: credibledata/community
          token: ${{ secrets.COMMUNITY_SITE_TOKEN }}
          path: site

      - name: Open its pull request
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_SITE_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: python3 scripts/community_card.py "packages/$PACKAGE" --site site --pr --source "$SOURCE"
