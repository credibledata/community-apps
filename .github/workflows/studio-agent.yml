# The studio's agents stay inside the caps Publisher serves an agent under. An agent over a cap is dropped from its
# package with only a warning, so a pull request that crosses one fails here instead.
name: Studio agent

on:
  pull_request:
    paths: ["packages/studio/**", "tests/test_studio_agent.py"]

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instructions, tasks and skills within Publisher's caps
        run: python3 tests/test_studio_agent.py
